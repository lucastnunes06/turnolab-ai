name: verified 90s product demonstration
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/demo-capture.yml'
      - 'scripts/capture_demo.py'
permissions:
  contents: read
jobs:
  capture:
    name: Capture real interface and API workflow
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      CHROMIUM_EXECUTABLE: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install app, browser and encoder
        run: |
          python -m pip install -r requirements.txt
          python -m pip install playwright==1.62.0 pillow==11.3.0
          python -m playwright install --with-deps chromium
      - name: Generate local synthetic data and train models
        run: python scripts/bootstrap.py
      - name: Capture ninety-second real walkthrough
        run: python scripts/capture_demo.py
      - name: Publish video evidence to GitHub Actions artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: turnolab-video-evidence
          path: |
            docs/media/demo.gif
            reports/demo.json
