name: optional deployment and MLflow evidence
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/extended-verification.yml'
      - 'backend/Dockerfile'
      - 'docker-compose.yml'
      - 'scripts/mlflow_check.py'
permissions:
  contents: read
jobs:
  docker-smoke:
    name: Docker Compose build and HTTP readiness
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build production container
        run: docker compose build
      - name: Run full bootstrap and check HTTP readiness
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          docker compose up -d
          for i in $(seq 1 360); do
            if curl --fail --silent http://127.0.0.1:8000/ready > /tmp/turnolab-ready.json; then
              cat /tmp/turnolab-ready.json
              curl --fail --silent http://127.0.0.1:8000/health
              exit 0
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' "$(docker compose ps -q turnolab)" 2>/dev/null || echo false)" != true ]; then
              echo "Container exited before readiness"; docker compose logs --tail=120; exit 1
            fi
            sleep 2
          done
          docker compose logs --tail=120
          exit 1
      - name: Container diagnostics
        if: always()
        run: |
          docker compose ps
          docker compose logs --tail=100
          docker compose down -v || true

  mlflow-tracking:
    name: Actual MLflow SDK local tracking
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install application and MLflow
        run: |
          python -m pip install -r requirements.txt
          python -m pip install mlflow==3.5.1
      - name: Train / register local artifacts
        run: python scripts/bootstrap.py
      - name: Test actual MLflow tracking and artifact storage
        run: python scripts/mlflow_check.py
      - name: Preserve MLflow evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mlflow-evidence
          path: reports/mlflow.json
