name: Normalize Python formatting once
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/normalize-once.yml'
permissions:
  contents: write
jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Normalize with project AST formatter
        run: python scripts/style_check.py --fix
      - name: Commit normalized source if needed
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add backend ml ai simulator scripts
            git commit -m 'style: normalize new Python benchmarks with project formatter'
            git push origin HEAD:main
          fi
