name: refresh-roadmap-artifacts-once
on:
  push:
    branches: [fix/roadmap-reliability-20261028]
    paths: [.github/workflows/refresh-roadmap.yml]
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OPENBLAS_NUM_THREADS: 1
      OMP_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: pip install -r requirements.txt
      - name: Normalize modified Python files
        run: python scripts/style_check.py --fix
      - name: Rebuild all synthetic models and evaluations
        run: python scripts/bootstrap.py
      - name: Evaluate shifted-seed interval coverage
        run: python scripts/independent_coverage_study.py
      - name: Run backend and frontend quality checks
        run: python scripts/check.py
      - name: Validate corrected decision policy
        run: |
          python - <<'PY'
          import json
          import pandas as pd
          p=pd.read_csv('reports/decision_scenarios.csv')
          r=json.load(open('reports/experiments.json'))
          assert len(p)==2000 and int(p.extra_staff.max())<=2
          assert p.policy_compliance.all()
          assert all(x['policy_compliance']==1 for x in r['strategies'])
          assert r['feasible_actions']==6
          print('policy validation passed; 2000 records, zero violations')
          PY
      - name: Commit reproducible reports and formatting to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ml/experiments.py ml/train.py ml/challenger.py scripts/bootstrap.py scripts/independent_coverage_study.py backend/tests/test_models_simulator.py
          git add reports/experiments.json reports/decision_scenarios.csv reports/decision_sensitivity.csv reports/decision_ablation.png
          git add reports/demand.json reports/demand_segments.csv reports/demand_comparison.csv reports/demand_evaluation.png reports/independent_coverage_study.json artifacts/registry.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "test: synchronize recomputed roadmap experiment artifacts"
            git push origin HEAD:fix/roadmap-reliability-20261028
          fi
