[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "turnolab-ai"
version = "0.1.0"
description = "An auditable synthetic restaurant decision laboratory"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.141.1", "uvicorn==0.52.1", "pydantic==2.13.4",
  "httpx==0.28.1",
  "pandas==2.2.3", "numpy==2.3.5", "scikit-learn==1.8.0",
  "matplotlib==3.10.8", "joblib==1.5.3",

]

[project.optional-dependencies]
tracking = ["mlflow-skinny==3.9.0", "sqlalchemy==2.0.46"]
dev = ["pytest==9.0.2", "pytest-cov==7.0.0", "ruff==0.15.1", "bandit==1.9.3", "playwright==1.62.0"]

[tool.setuptools.packages.find]
include = ["backend*", "ml*", "ai*", "simulator*"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
exclude = [".venv", "frontend", "artifacts", "reports"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

